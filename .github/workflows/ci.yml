name: CI
on:
  push:
    branches: [master, 'dev/**', 'feat/**', 'fix/**']
    tags: ['v*']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  validation:
    name: validation-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m ruff check src tests tools
      - run: python -m ruff format --check src tests tools
      - run: python tools/check_repository.py
      - run: python -m pytest -q
      - run: python -m build --no-isolation
      - if: runner.os == 'Windows'
        run: python -m pip install -r requirements-windows-build.lock
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/build_windows.ps1 -Python (Get-Command python).Source
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DeepTrace-windows-x64
          path: |
            dist/DeepTrace.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validation
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: DeepTrace-windows-x64
          path: dist
      - shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = ((Get-Content src/deeptrace/__init__.py | Select-String '__version__ = "([0-9.]+)"').Matches.Groups[1].Value)
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Le tag ne correspond pas à la version du code.' }
          gh release create $env:GITHUB_REF_NAME dist/DeepTrace.exe dist/SHA256SUMS.txt --verify-tag --generate-notes --title "DeepTrace $version"
