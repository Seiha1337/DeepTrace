name: CI
on:
  push:
    branches: [master, 'dev/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  validation:
    name: validation-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m ruff check src tests tools
      - run: python -m ruff format --check src tests tools
      - run: python tools/check_repository.py
      - run: python -m pytest -q
      - run: python -m build --no-isolation
